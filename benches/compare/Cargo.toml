[package]
name = "orderbook-rs-bench-compare"
version = "0.0.0"
edition = "2024"
publish = false
description = """
Standalone A/B latency-comparison harness for orderbook-rs (issues #258
/ #259). Not a member of the crate's own workspace (see the `[workspace]`
table below) and not published — driven by `scripts/bench_compare.sh`,
which builds this crate once per side inside two separate git worktrees
so that byte-identical benchmark source runs against two different
`orderbook-rs` checkouts (e.g. the `v0.13.1` tag and HEAD).
"""

# Opts this crate out of the parent crate's workspace (which only lists
# `examples` under `[workspace] members`) so `cargo package` / `cargo
# publish` at the repo root never tries to build or validate it, and so
# `cargo build --workspace` at the root never touches it either. See
# `~/Repos/Local/PriceLevel/benches/compare` for the pattern this ports.
[workspace]

[features]
default = []
# Selects the adapter module in `src/adapter.rs` for the checked-out
# `orderbook-rs` API. The three scenarios this crate drives today
# (add_only / cancel_only / aggressive_walk) have an identical
# `OrderBook` call surface across every version this harness currently
# targets (verified against the `v0.13.1` tag during the #258 audit) —
# both features select the same adapter body for now. The split exists
# so a *future* API break is a new `#[cfg(feature = ...)]` arm in
# `adapter.rs`, not a rewrite of `workloads.rs`.
v0_13 = []
head = []

[dependencies]
# Path dependency, not a version — `scripts/bench_compare.sh` copies
# this whole `benches/compare/` directory into two independent git
# worktrees, so `../..` always resolves to *that worktree's own*
# `orderbook-rs` checkout, whatever ref it has checked out. This is
# what makes "one bench crate, two checkouts" work: each side's
# `orderbook-rs` pulls in whichever `pricelevel` it depends on
# (`0.9.1` for `v0.13.1`, `0.10` for HEAD), and the version range below
# is wide enough that Cargo's resolver unifies our own direct
# `pricelevel` dependency with that same transitive one on both sides,
# rather than needing two copies of the crate in one dependency graph.
orderbook-rs = { path = "../.." }
# `Hash32::new` (needed so every scenario seeds/cancels/matches with a
# `user_id`, matching the headline `benches/order_book/*_hdr.rs` shape
# exactly — see `adapter::owner`) is stable across every version this
# range spans; verified identical in `pricelevel` `0.9.1` and `0.10.0`
# during the #258 review.
pricelevel = ">=0.9.0, <0.11.0"
hdrhistogram = "7.6"

[[bin]]
name = "compare"
path = "src/main.rs"
