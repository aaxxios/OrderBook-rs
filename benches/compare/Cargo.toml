[package]
name = "orderbook-rs-bench-compare"
version = "0.0.0"
edition = "2024"
publish = false
description = """
Standalone A/B latency-comparison harness for orderbook-rs (issues #258
/ #259). Not a member of the crate's own workspace (see the `[workspace]`
table below) and not published — driven by `scripts/bench_compare.sh`,
which builds this crate once per side inside two separate git worktrees
so that byte-identical benchmark source runs against two different
`orderbook-rs` checkouts (e.g. the `v0.13.1` tag and HEAD).
"""

# Opts this crate out of the parent crate's workspace (which only lists
# `examples` under `[workspace] members`) so `cargo package` / `cargo
# publish` at the repo root never tries to build or validate it, and so
# `cargo build --workspace` at the root never touches it either. See
# `~/Repos/Local/PriceLevel/benches/compare` for the pattern this ports.
[workspace]

[features]
default = []
# Selects the adapter module in `src/adapter.rs` for the checked-out
# `orderbook-rs` API. The two arms share every call except
# `create_snapshot` (a plain return value on `v0.13.1`, a `Result` on
# HEAD / 0.14.0); see the module docs of `src/adapter.rs` (#259).
v0_13 = []
head = []

[dependencies]
# Path dependency, not a version — `scripts/bench_compare.sh` copies
# this whole `benches/compare/` directory into two independent git
# worktrees, so `../..` always resolves to *that worktree's own*
# `orderbook-rs` checkout, whatever ref it has checked out. This is
# what makes "one bench crate, two checkouts" work without needing two
# different `pricelevel`/`orderbook-rs` versions in the same
# dependency graph.
#
# Deliberately NOT a direct `pricelevel` dependency (tried during #258
# review, reverted): `v0.13.1` pins `pricelevel = "0.9"` and HEAD pins
# `"0.10"` — 0.x minor bumps are a SemVer-incompatible jump under
# Cargo's pre-1.0 rules, so a single version requirement here wide
# enough to match both (`>=0.9, <0.11`) does not make Cargo unify on
# one one of them; it resolves our own edge to the newest match (0.10.x)
# independently of whatever `orderbook-rs`'s own edge resolves to,
# producing two incompatible copies of the `pricelevel` crate in one
# dependency graph and an E0308 on every `Hash32`-typed argument. See
# `adapter::owner`'s doc for how every scenario attaches a `user_id`
# without ever naming `pricelevel::Hash32` here.
orderbook-rs = { path = "../.." }
hdrhistogram = "7.6"

[[bin]]
name = "compare"
path = "src/main.rs"
